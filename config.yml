# ============================================================================
# Bluestone Pro Wash - Automated Post-Job Follow-Up
# CONFIG FILE - everything you might want to tweak lives here.
# Nothing in this file requires code changes. Edit, save, restart the service.
# ============================================================================

# ---------------------------------------------------------------------------
# 1. TIMEZONE & SEND TIMING
# ---------------------------------------------------------------------------
timezone: America/Chicago        # all times below are in this zone (CT)

initial_followup:
  # When the check-in text goes out:
  #   next_morning    -> the morning AFTER the job date, at next_morning_time.
  #                      Simple, and it doesn't matter how long the job ran.
  #   hours_after_end -> hours_after_end hours after the job's scheduled end time,
  #                      shifted into send_window_start .. send_window_end
  #                      (past the window -> next morning at deferred_send_time).
  schedule: next_morning
  next_morning_time: "09:00"       # 9:00 AM CT

  # Only used when schedule is hours_after_end:
  hours_after_end: 5
  completion_basis: scheduled_end_time
  send_window_start: "08:30"
  send_window_end:   "19:00"
  deferred_send_time: "08:30"

closeout:
  # After a SATISFIED reply, wait this long before sending the closeout text
  # (quotes / referral / review) so it reads like a person, not an instant bot.
  # Note: the closeout still can't go out before the next poller run that sees
  # it as due - so with a 60-min poller the real gap is 2 min up to ~1 hr.
  delay_minutes_after_satisfied: 2

  # true  = if the job notes have no parseable "future quotes:" section, HOLD the
  #         closeout (customer gets nothing) and re-check every run until the
  #         tech adds quotes in RevDek, then send automatically.
  # false = always send the closeout; if there are no future quotes, just skip
  #         that paragraph and still send the window plan / referral / review.
  # Currently false: quotes may legitimately be missing and the customer should
  # still get the rest.
  require_future_quotes: false

  # Only used when require_future_quotes is true: if a closeout has been held
  # this long waiting on notes, text Anderson once. Set to 0 to disable.
  hold_hours_before_alert: 24

poller:
  # How often the scheduled job wakes up to look for work.
  interval_minutes: 60
  # Safety cap: most check-ins to send in a single poller run.
  max_sends_per_run: 25

# ---------------------------------------------------------------------------
# 2. REPLY CLASSIFICATION (Claude)
# ---------------------------------------------------------------------------
classification:
  model: claude-sonnet-5
  # Buckets the reply is sorted into. Do not rename without updating the branches.
  # SATISFIED / DISSATISFIED / UNCLEAR / CONTACT_REQUEST
  # Only SATISFIED gets the automated closeout. Everything else (DISSATISFIED,
  # CONTACT_REQUEST, and UNCLEAR) goes straight to Anderson - there is no
  # automated clarifying text. Re-asking "did everything turn out well?" after
  # an ambiguous or negative reply reads as tone-deaf, so a person takes it
  # from there instead.
  system_prompt: |
    You classify a customer's SMS reply to a "how did the job turn out?" text
    from a pressure-washing company. Respond with exactly one word:
    SATISFIED, DISSATISFIED, UNCLEAR, or CONTACT_REQUEST.
    - CONTACT_REQUEST: they want a person to reach out - "call me", "have someone
      call", "text me back", "I want to talk to someone". Use this even if the
      tone is neutral or positive. It takes priority over the others.
    - SATISFIED: clearly positive / happy / no complaints AT ALL. If they mention
      anything - even one small negative detail alongside praise - do not use
      SATISFIED.
    - DISSATISFIED: any complaint, disappointment, unresolved issue, or negative
      tone - even a minor one mentioned alongside otherwise positive comments.
    - UNCLEAR: ambiguous, off-topic, a question, or not enough to tell.
    When in doubt between SATISFIED and DISSATISFIED, choose UNCLEAR.

  # Phrases that force CONTACT_REQUEST no matter what the classifier says.
  # Matched as lowercase substrings. Leave unset to use the built-in list.
  # contact_request_phrases:
  #   - call me
  #   - text me back
  #   - have someone reach out

# ---------------------------------------------------------------------------
# 3. MESSAGE TEMPLATES  (plain text - these send as real SMS)
#    - Write each PARAGRAPH as ONE line; the phone wraps it. Blank line
#      between paragraphs = blank line in the text.
#    - Placeholders in [brackets] are filled in at send time.
#    - [quote_list] and [window_plan_block] expand to their own block, or to
#      nothing - the surrounding blank line collapses automatically.
# ---------------------------------------------------------------------------
templates:
  check_in: |
    Hey [first_name] this is Anderson. Thank you for your business we really appreciate it! How did everything turn out?

  # SATISFIED reply + the job notes HAVE a future-quotes section.
  closeout_with_quotes: |
    Glad to hear it! Here's the quotes we came up with for you while we were there - good for the next [quote_validity_months] months, so no need to get a new quote when you're ready:

    [quote_list]

    [window_plan_block]

    Also, if you refer a friend you both get [referral_discount] off your next service!

    Last thing, if you want to leave us a review those are super helpful and would mean a lot! here's the link: [review_link]

  # SATISFIED reply + NO future-quotes section in the job notes.
  closeout_no_quotes: |
    Glad to hear it!

    [window_plan_block]

    If you refer a friend you both get [referral_discount] off your next service!

    Last thing, if you want to leave us a review those are super helpful and would mean a lot! here's the link: [review_link]

  # Window cleaning bundled WITH another service - percentages only.
  window_plan_block: |
    Since we did your windows - we offer window cleaning service plans too: [semi_annual_pct]% off for semi-annual, [quarterly_pct]% off for quarterly.

  # Window cleaning ONLY - real plan price off this job's price.
  window_plan_block_priced: |
    Since we did your windows - we offer window cleaning service plans: semi-annual at $[semi_annual_price]/visit ([semi_annual_pct]% off), or quarterly at $[quarterly_price]/visit ([quarterly_pct]% off).

  # Goes to Anderson when a reply asks for a callback / to talk to someone.
  # Nothing is sent to the customer - Anderson calls them.
  contact_request: |
    [customer_name] ([customer_phone]) asked to be contacted about the [service] job on [date]. Their reply: "[reply_text]". No automated reply was sent - give them a call.

  # Goes to Anderson (not the customer) when a happy customer's closeout is
  # being held because the job notes have no "future quotes" section yet.
  notes_needed: |
    [customer_name] replied happy to the [service] check-in on [date], but the job notes have no "future quotes" section, so the closeout text is on hold. Add the future quotes to that job in RevDek and it'll send automatically - or close it out yourself.

  # Goes to Anderson, not the customer.
  escalation: |
    Heads up - [customer_name] ([customer_phone]) replied about the [service] job on [date] and didn't sound fully satisfied. Their reply: "[reply_text]". No automated follow-up was sent. Handle directly when you can.

  # Goes to Anderson when a customer replies AFTER the closeout text (e.g. asking
  # about a service plan, a referral, more work). The automation does nothing
  # else - Anderson replies personally.
  closeout_reply: |
    [customer_name] ([customer_phone]) replied after the closeout on the [service] job: "[reply_text]". They may want to book something (service plan, referral, more work). No automated reply was sent - follow up with them.

template_values:
  referral_discount: "$50"
  quote_validity_months: 12
  review_link: "https://g.page/r/CduHUezMoZtTEBM/review"
  business_name: "Bluestone Pro Wash"

# ---------------------------------------------------------------------------
# 4. JOB-NOTES QUOTE PARSING
#    Real example that must parse:
#    "future quotes: roof wash $700, driveway pressure wash: $300"
# ---------------------------------------------------------------------------
quote_parsing:
  section_header: "future quotes"   # case-insensitive; parsing starts after this
  # Each rendered line, [service] and [amount] filled from the notes.
  line_format: "- [service]: $[amount]"
  # Title-case the service name when rendering (roof wash -> Roof Wash).
  titlecase_service: true
  # Techs sometimes write the price with no $ sign, number first, e.g.
  # "750 roof, she said she would wait". A bare leading number is only
  # treated as a price if it's at least this much - keeps small incidental
  # numbers ("2 window screens", "3 dogs on site") from being read as quotes.
  bare_number_min_amount: 20

# ---------------------------------------------------------------------------
# 4b. WINDOW CLEANING SERVICE PLANS
#     If the job's service_type list includes a match below, the closeout
#     text gets the window_plan_block paragraph (section 3).
# ---------------------------------------------------------------------------
window_cleaning_plans:
  enabled: true
  service_match: "window cleaning"   # case-insensitive substring match on service_type
  semi_annual_discount_pct: 15
  quarterly_discount_pct: 20
  # When the job's ONLY service is window cleaning, show real plan prices
  # (window_plan_block_priced) computed off the job price. When window cleaning
  # is bundled with another service, the window price can't be isolated, so it
  # falls back to percentages only (window_plan_block).
  show_calculated_price: true
  price_rounding: nearest_dollar   # nearest_dollar | nearest_5 | none

# ---------------------------------------------------------------------------
# 5. ESCALATION TO ANDERSON
# ---------------------------------------------------------------------------
escalation:
  method: sms                    # sms | email
  # Kept OUT of this file (public repo). Set on the cloud routine as env vars
  # BLUESTONE_ESCALATION_SMS and BLUESTONE_ESCALATION_EMAIL. Locally, export them
  # or edit the :- fallback here.
  sms_to:  "${BLUESTONE_ESCALATION_SMS}"
  email_to: "${BLUESTONE_ESCALATION_EMAIL:-}"
  # Don't re-alert Anderson about the same customer within this many days.
  dedupe_days: 30
  draft_summary_with_claude: false

  # After the closeout is sent, if the customer replies again (service plan,
  # referral, more work), text Anderson so he can follow up. The automation
  # sends nothing further to the customer. Set false to ignore post-closeout
  # replies entirely.
  notify_on_closeout_reply: true

# ---------------------------------------------------------------------------
# 6. SENDING / PROVIDER / SAFETY
# ---------------------------------------------------------------------------
sending:
  provider: quo
  # The dedicated Quo number this automation texts from. Informational only -
  # the send goes through the Quo connection, which already knows the number.
  from_number: "${BLUESTONE_FROM_NUMBER:-}"

  # true = log what WOULD be sent, send nothing. false = actually send.
  dry_run: false

  # HARD KILL SWITCH. true = the engine returns zero send/notify actions, always.
  # Independent of dry_run and of the routine being enabled.
  # Cleared 2026-09-14: job-indicator marker system built + read/write verified
  # via MCP. Re-enabling in dry_run first to watch it decide correctly before
  # any real send.
  halted: false

  respect_opt_outs: true         # never message a number that replied STOP
  a2p_10dlc_registered: true     # confirmed 2026-09-02

  # Safety: ignore any job whose scheduled date is before this. Stops a first run
  # from back-filling historical completed jobs. Set it to the go-live date.
  # Overridable per-run with the BLUESTONE_COMPLETED_SINCE env var.
  #
  # Bumped to 2026-09-16 when job_allowlist opened to all jobs - without this,
  # every real completed job back to 9/8 (e.g. Keith S, and anyone else never
  # part of testing) would have become eligible for a check-in text on the
  # next run. Only jobs completed 9/16 or later are ever touched now.
  completed_since: "${BLUESTONE_COMPLETED_SINCE:-2026-09-16}"

  # Safety: ignore any job older than this many days (a stale completed job that
  # never got followed up shouldn't suddenly get a text weeks later).
  max_job_age_days: 14

  # Test scoping: when this list is non-empty, ONLY these job IDs are ever
  # followed up - every other completed job is ignored. Empty [] = normal
  # operation, every completed job in RevDek is in scope.
  #
  # Live end-to-end proven 2026-09-16 on a real customer (Kay Harrison) - full
  # cycle worked (check-in -> positive reply -> correct closeout, no
  # duplicates). Now running in production for every completed job.
  job_allowlist: []

guardrails:
  # Never send closeout without an explicit SATISFIED classification.
  require_explicit_satisfied: true
  one_send_per_stage_per_job: true

# ---------------------------------------------------------------------------
# 8. IDEMPOTENCY MARKERS
# ---------------------------------------------------------------------------
markers:
  # The Quo conversation only syncs into RevDek when a human opens the inbox, so
  # the automation can't trust it to know what it already sent. Instead it stamps
  # THIS job indicator right after every send, and checks it before sending -
  # job indicators sync reliably even headless.
  #
  # SETUP: this indicator must exist and be ENABLED in RevDek
  # (Customize -> Job Indicators). The automation writes only to its per-job
  # note; nothing else touches it. Its note looks like:
  #     checkin sent 2026-09-10T14:03:00Z
  #     closeout sent 2026-09-10T15:20:00Z
  indicator_name: "Bluestone Automation"

# ---------------------------------------------------------------------------
# 6. MANUAL OVERRIDE - skip straight to the closeout text
#    Add the "Confirmed Satisfied" indicator to a job in RevDek (one tap,
#    same as any other job indicator) whenever you already know the customer
#    is happy through some channel other than replying to the automated
#    check-in - e.g. they texted or called you directly to say thanks. The
#    next hourly run sends the closeout straight away: no check-in wait, no
#    classification needed. Safe to leave the indicator on the job afterward -
#    the actual do-not-resend guard is the separate "Bluestone Automation"
#    marker above, so this can't cause a duplicate send.
#
#    SETUP: create and enable a "Confirmed Satisfied" indicator in RevDek
#    (Customize -> Job Indicators) - matched by name, no notes needed.
# ---------------------------------------------------------------------------
